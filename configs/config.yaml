# bepilot configuration. Values of the form ${VAR} are expanded from the
# environment at load time. A few well-known env vars also override entries
# directly: DATABASE_URL, ANTHROPIC_API_KEY, OPENAI_API_KEY,
# BEPILOT_DEFAULT_PROVIDER, BEPILOT_HTTP_ADDR.

env: ${BEPILOT_ENV}

http:
  addr: ${BEPILOT_HTTP_ADDR}
  read_timeout: 65s
  write_timeout: 0s          # keep 0 for SSE
  shutdown_timeout: 20s
  cors_origins: []           # empty = allow any origin
  max_request_body_mb: 64    # document uploads; base64 adds a third
  # DEV ONLY: skips x-api-key verification entirely when true. Never enable
  # this in a deployed environment.
  auth_bypass: ${BEPILOT_AUTH_BYPASS}   # empty/false = auth required (default)

db:
  dsn: ${DATABASE_URL}
  max_conns: 10
  min_conns: 1
  max_conn_lifetime: 1h
  auto_migrate: true

llm:
  default_provider: ${BEPILOT_DEFAULT_PROVIDER}
  default_model: ${BEPILOT_DEFAULT_MODEL}
  summary_model: ${BEPILOT_DEFAULT_MODEL}
  # Per-reply output cap. A reply cut off by it is continued automatically (up to
  # 4 times), but every continuation re-sends the conversation, so a cap that fits
  # typical long answers is cheaper than relying on that.
  max_tokens: 16000
  # Default sampling temperature when a request sets none. Leave unset for the
  # provider's default; use 0-0.3 where the same request should give the same
  # answer on every run.
  # temperature: 0.2
  request_timeout: 5m
  providers:
    claude:
      kind: claude
      api_key: ${ANTHROPIC_API_KEY}
      base_url: ${ANTHROPIC_BASE_URL}
    openai:
      kind: openai
      # api_key is optional for local OpenAI-compatible servers (LM Studio,
      # llama.cpp, vLLM, Ollama). base_url may be the API base
      # (http://127.0.0.1:1234/v1) or a full endpoint URL — the
      # /chat/completions suffix is trimmed automatically.
      api_key: ${OPENAI_API_KEY}
      base_url: ${OPENAI_BASE_URL}
    # Deterministic, network-free provider for local development and tests.
    fake:
      kind: fake

embedding:
  # 'hash' is deterministic and needs no API key. Switch to 'openai' for real
  # semantic retrieval (keep dim consistent with the migration: 1536).
  kind: ${BEPILOT_EMBEDDING_KIND}
  model: text-embedding-3-small
  api_key: ${OPENAI_API_KEY}
  base_url: ${OPENAI_BASE_URL}
  dim: 1536

agent:
  identity: >-
    You are bepilot, a helpful, precise AI assistant. You give direct,
    well-structured answers, use tools and skills when they materially improve
    the result, and you never fabricate facts or tool output.
  response_style: >-
    Prefer concise, skimmable answers in Markdown. Lead with the answer, then
    supporting detail. Match the user's language.
  # Most times one turn may call the model (each tool round is one call). On the
  # last call the model gets no tools and must answer, so a turn that runs out
  # of budget still ends with a reply instead of an error.
  max_steps: 16
  history_token_budget: 24000
  summarize_every_n: 8
  skill_top_k: 4
  ping_interval: 15s

skills:
  dir: ${BEPILOT_SKILLS_DIR}
  sync_on_startup: true

tools:
  http_allowlist: []          # empty = any public host

mcp:
  # Model Context Protocol servers. Both sources below are hot-reloadable — a
  # server can be attached or detached while the process runs, and its tools
  # appear on the next message with no restart.
  enabled: ${BEPILOT_MCP_ENABLED}   # empty/false = MCP off, API returns 503
  # Static server list. Edit this file while running: changes are reconciled
  # within reload_interval. Leave file blank to use the API only.
  file: configs/mcp.yaml
  reload_interval: 10s              # 0 = load once at startup, never re-read
  init_timeout: 20s                 # per-server connect + handshake budget
  tool_prefix: "mcp__"             # tools import as <prefix><server>__<tool>

documents:
  # /v1/documents/parse and /v1/documents/messages read PDFs and images with
  # docpipe: render pages, OCR them with TurboOCR, optionally re-read them with
  # a vision model. Off = both endpoints answer 503.
  enabled: ${BEPILOT_DOCUMENTS_ENABLED}
  render_mode: webassembly          # or multi_threaded (needs libpdfium + pdfium-worker)
  render_workers: 2
  dpi: 300
  concurrency: 4                    # pages read at once
  max_file_mb: 32
  max_files: 5                      # documents per /v1/documents/messages request
  # Uploaded documents (/v1/documents) are read in the background.
  workers: 2                        # documents read at once
  lease: 2m                         # a worker's hold on a document, renewed while it works
  max_attempts: 3                   # tries before a document is marked failed
  wait_timeout: 15m                 # how long a streamed question waits for its documents
  # Context the model must fit a question with its documents in (tokens);
  # 0 skips the check. context_windows overrides it per model.
  context_window: 0
  # context_windows:
  #   claude-sonnet-5: 200000
  ocr:
    base_url: ${TURBOOCR_URL}       # TurboOCR server (POST /ocr/raw)
    timeout: 2m
  vlm:
    # OpenAI-compatible vision model that re-reads each page into markdown.
    # Leave base_url empty for OCR only.
    base_url: ${DOCS_VLM_BASE_URL}
    api_key: ${DOCS_VLM_API_KEY}
    model: ${DOCS_VLM_MODEL}
    timeout: 5m
    # Compare the numbers of the VLM markdown with the OCR text:
    #   off     - no check
    #   detect  - mark conflicting numbers unverified, change nothing
    #   confirm - ask the VLM about them in the same conversation (the server's
    #             prefix cache reuses the image); replace only when it is sure
    number_check: confirm

log:
  level: ${BEPILOT_LOG_LEVEL}
  format: ${BEPILOT_LOG_FORMAT}
