# MCP server list (static source). Referenced by mcp.file in config.yaml and
# only read when mcp.enabled is true.
#
# Edit this file while the server is running: within mcp.reload_interval the
# process reconciles the changes —
#   * a new entry            -> the server is dialed, its tools registered
#   * a removed / disabled   -> the server is detached, its tools dropped
#   * a changed entry        -> the server is redialed with the new spec
# No restart. Tools import under the name  mcp__<name>__<tool>.
#
# ${VAR} is expanded from the environment at load time (same as config.yaml).
# Servers added through POST /v1/mcp/servers are stored in the database instead
# and must NOT be duplicated here (the file entry would be ignored).

servers: []

# ---------------------------------------------------------------------------
# Examples — uncomment and adjust. Fields by transport:
#
# stdio  (process spawns a child, talks over stdin/stdout):
#   - name: filesystem
#     transport: stdio
#     command: npx
#     args: ["-y", "@modelcontextprotocol/server-filesystem", "/data/workspace"]
#
#   - name: github
#     transport: stdio
#     command: docker
#     args: ["run", "-i", "--rm", "-e", "GITHUB_PERSONAL_ACCESS_TOKEN", "ghcr.io/github/github-mcp-server"]
#     env:
#       GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN}
#
# streamable_http  (remote server, recommended for production):
#   - name: search
#     transport: streamable_http
#     url: https://mcp.example.com/mcp
#     headers:
#       Authorization: "Bearer ${SEARCH_MCP_TOKEN}"
#     tool_allowlist: ["web_search", "fetch_url"]   # import only these tools
#
# sse  (older SSE-style server):
#   - name: internal
#     transport: sse
#     url: http://127.0.0.1:9000/sse
#     always_bound: false      # tools exist but are only offered to skills that
#                              # list e.g. mcp__internal__<tool>
#
# disabled: true keeps an entry in the file without attaching it.
