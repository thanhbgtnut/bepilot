        description: Status is pending (waiting for a worker), processing, ready or
          failed.
        enum:
        - pending
        - processing
        - ready
        - failed
        example: processing
        type: string
      token_count:
        description: approximate tokens of the full text (ready documents)
        example: 0
        type: integer
      unverified_numbers:
        description: |-
          UnverifiedNumbers counts numbers the vision model and OCR read
          differently and that were not confirmed; each is noted in its page.
        example: 0
