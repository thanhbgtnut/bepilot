        a PDF is rendered page by page, every page is read by TurboOCR and, when a
        VLM is configured, re-read by it into markdown. Returns the markdown of every
        page and of the whole document. A page that could not be read carries an `error`
        and the rest still return; when no page can be read the response is `502`.
        The request, the file and the result are stored (`document_requests`, `document_files`).'
