basePath: /
definitions:
  dto.AGUIContextItem:
    properties:
      description:
        type: string
      value:
        type: string
    type: object
  dto.AGUIMessage:
    properties:
      content:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        description: user | assistant | tool | system | developer
        type: string
      toolCallId:
        type: string
    type: object
  dto.AGUIRunAgentInput:
    properties:
      context:
        items:
          $ref: '#/definitions/dto.AGUIContextItem'
        type: array
      forwardedProps:
        type: object
      messages:
        items:
          $ref: '#/definitions/dto.AGUIMessage'
