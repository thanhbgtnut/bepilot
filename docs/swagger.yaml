        type: array
    type: object
  dto.AGUIToolDefinition:
    properties:
      description:
        type: string
      name:
        type: string
      parameters:
        type: object
    type: object
  dto.CreateSessionRequest:
    properties:
      metadata:
        additionalProperties: {}
        type: object
      model:
        type: string
      provider:
        type: string
